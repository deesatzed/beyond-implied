[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beyond-implied"
version = "0.0.1"
description = "Does a forecast add information beyond what the options market already priced?"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Wayne A. Satz" }]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
theta = ["thetadata>=1.0.9"]

[project.scripts]
bi = "beyond_implied.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/beyond_implied"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
